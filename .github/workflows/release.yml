name: ModLocale release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify release version, app, and regression tests
        run: |
          node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
          node --check app.js
          node --check core.js
          npm test
      - name: Build release ZIP and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="ModLocale-v${version}.zip"
          zip -r "$archive" index.html styles.css app.js core.js README.md CHANGELOG.md LICENSE VERSION package.json tests
          sha256sum "$archive" > "${archive}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ModLocale-v${GITHUB_REF_NAME#v}.zip" "ModLocale-v${GITHUB_REF_NAME#v}.zip.sha256" --title "ModLocale ${GITHUB_REF_NAME}" --generate-notes
